name: Branch Inventory

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: List remote branch heads
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads https://github.com/${{ github.repository }}.git | sort -k2
