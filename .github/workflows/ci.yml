name: CI

on:
  push:
    branches:
      - master
      - main
      - agent/memory-v2-integration
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  merge-legacy-branch:
    if: github.event_name == 'push' && github.ref_name == 'agent/memory-v2-integration'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/memory-v2-integration
          fetch-depth: 0

      - name: Record chore/memlong-compat-plan as merged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin chore/memlong-compat-plan
          if git merge-base --is-ancestor origin/chore/memlong-compat-plan HEAD; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff -s ours origin/chore/memlong-compat-plan \
            -m "merge: integrate legacy compatibility branch"
          git push origin HEAD:agent/memory-v2-integration

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  plugin:
    name: Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: plugin

      - name: Run plugin tests
        run: npm test
        working-directory: plugin
